# Home server: NPMplus + private PKI (step-ca) + wildcard DNS for *.matrix.internal
# Settings live in .env (copy .env.example). See SERVER-SETUP.md.
name: gateway

services:
  dnsmasq:
    # Answers every *.matrix.internal with NPMplus. Used by step-ca (to check
    # names before issuing certs) and by your devices over the VPN.
    image: docker.io/dockurr/dnsmasq:2.93
    container_name: dnsmasq
    restart: unless-stopped
    # The wildcard answer is BIND_IP from .env: the address where NPMplus listens.
    # Your devices and step-ca both reach NPMplus there.
    entrypoint: ["dnsmasq", "--conf-file=/etc/dnsmasq.conf", "--keep-in-foreground",
                 "--log-facility=-", "--no-resolv", "--address=/matrix.internal/${BIND_IP}"]
    volumes:
      - ./dnsmasq/dnsmasq.conf:/etc/dnsmasq.conf:ro
    ports:
      - "${BIND_IP}:53:53/udp"
      - "${BIND_IP}:53:53/tcp"
    networks:
      gateway:
        ipv4_address: 172.30.10.53   # fixed, so step-ca can use it as its DNS server

  step-ca:
    image: docker.io/smallstep/step-ca:0.30.2
    container_name: step-ca
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      # Only used on the very first start, when ./step-ca-data is empty:
      - DOCKER_STEPCA_INIT_NAME=Matrix
      - DOCKER_STEPCA_INIT_DNS_NAMES=step-ca,localhost
      - DOCKER_STEPCA_INIT_ACME=true
    volumes:
      - ./step-ca-data:/home/step
    # No published port: only NPMplus (over the Docker network) and
    # client-cert.sh (docker exec) talk to the CA.
    dns:
      - 172.30.10.53
    networks:
      - gateway
    depends_on:
      - dnsmasq
    healthcheck:
      test: ["CMD", "step", "ca", "health", "--ca-url", "https://localhost:9000", "--root", "/home/step/certs/root_ca.crt"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  npmplus:
    image: docker.io/zoeyvid/npmplus:latest
    container_name: npmplus
    restart: unless-stopped
    labels:
      - wud.watch.digest=true
    depends_on:
      step-ca:
        condition: service_healthy
    ports:
      # Only on BIND_IP (your WireGuard address once the VPN runs).
      - "${BIND_IP}:80:80"
      - "${BIND_IP}:443:443/tcp"
      - "${BIND_IP}:443:443/udp"
      # Admin UI only from the server itself; normally use https://npm.matrix.internal
      - "127.0.0.1:81:81"
    volumes:
      - ./data:/data
      # MIGRATION ONLY: your old NPM certs. Remove after the first successful start.
      - ./letsencrypt:/etc/letsencrypt
      # Root of the private CA, read-only, so certbot can verify step-ca's TLS.
      - ./step-ca-data/certs:/pki:ro
    environment:
      - TZ=${TZ}
      - ACME_EMAIL=${ACME_EMAIL}
      # All new certificates come from your own CA:
      - ACME_SERVER=https://step-ca:9000/acme/acme/directory
      - REQUESTS_CA_BUNDLE=/pki/root_ca.crt
    networks:
      gateway: {}
      apps: {}                       # your app stacks join this network

networks:
  # Internal network for dnsmasq, step-ca and NPMplus. It has a fixed subnet
  # because step-ca's "dns:" setting needs dnsmasq's IP, not its name.
  gateway:
    name: gateway
    ipam:
      config:
        - subnet: 172.30.10.0/24   # change if it clashes with another network on the server
  # Your existing shared network: app stacks that list nginxproxymanager_default
  # keep working unchanged, and NPMplus reaches them by container name.
  apps:
    external: true
    name: nginxproxymanager_default
