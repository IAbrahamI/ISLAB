# Every name under matrix.internal -> NPMplus. That rule is in docker-compose.yml,
# because it uses BIND_IP from .env.
# Everything else -> public DNS directly (Quad9, Cloudflare). Not via the Pi's own
# resolver: if the router uses the Pi as its DNS, that would loop.
server=9.9.9.9
server=1.1.1.1
# Don't forward plain names without a dot
domain-needed
bogus-priv
cache-size=1000
