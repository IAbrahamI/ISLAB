# mTLS gate used by proxy hosts with "verify client: optional" (see README).
# 1 = block. Valid client cert passes; ACME HTTP-01 challenge path stays open
# so the private CA can renew the server cert.
map "$ssl_client_verify:$uri" $mtls_block {
    default                                1;
    "~^SUCCESS:"                           0;
    "~^[^:]*:/\.well-known/acme-challenge/" 0;
}
