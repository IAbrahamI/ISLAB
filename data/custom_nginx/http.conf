# mTLS gate for proxy hosts with "Make mTLS Optional" + Advanced: if ($mtls_block) { return 403; }

# Revoked client certs (serial -> 1). Maintained by: ./client-cert.sh revoke <name>
map $ssl_client_serial $mtls_revoked {
    default 0;
    include /data/custom_nginx/revoked-serials.map;
}

# 1 = block. Passes: a valid, non-revoked client cert, and the ACME check path
# (so your CA can renew server certs on mTLS hosts).
map "$ssl_client_verify:$mtls_revoked:$uri" $mtls_block {
    default                                    1;
    "~^SUCCESS:0:"                             0;
    "~^[^:]*:[01]:/\.well-known/acme-challenge/" 0;
}
